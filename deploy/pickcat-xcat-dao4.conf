# PICKCAT 第三方测试站（dangerous_xcat.dao4.fun）
# Cloudflare 代理 -> 本机 node(127.0.0.1:4174)
#
# 域名含下划线，Let's Encrypt 无法签发，源站用自签证书，
# 所以 Cloudflare 的 SSL/TLS 模式必须是 Flexible 或 Full，不能是 Full (strict)。

server {
    listen 80;
    listen [::]:80;
    server_name dangerous_xcat.dao4.fun;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    client_max_body_size 25m;

    access_log /var/log/nginx/pickcat-xcat.access.log;
    error_log  /var/log/nginx/pickcat-xcat.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dangerous_xcat.dao4.fun;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    ssl_certificate     /etc/nginx/ssl/pickcat-xcat.crt;
    ssl_certificate_key /etc/nginx/ssl/pickcat-xcat.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:pickcat_xcat:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    access_log /var/log/nginx/pickcat-xcat.access.log;
    error_log  /var/log/nginx/pickcat-xcat.error.log;

    location / {
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
